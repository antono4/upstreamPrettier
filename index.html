<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Marbel AI — Chat AI Gratis</title>
<meta name="theme-color" content="#0f172a" />
<meta name="description" content="Marbel AI — mengobrol dengan beragam model AI gratis tanpa akun." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%231e293b'/%3E%3Cstop offset='1' stop-color='%230f172a'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath fill='%2364748b' d='M16 5l1.7 5.1a2.2 2.2 0 0 0 1.4 1.4l5.1 1.7-5.1 1.7a2.2 2.2 0 0 0-1.4 1.4L12 18.9l-1.7-5.1a2.2 2.2 0 0 0-1.4-1.4L3.8 10.7l5.1-1.7a2.2 2.2 0 0 0 1.4-1.4L12 2.5z'/></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page-container">
    <div class="layout">
      <main class="main">
        <!-- ============ Header atas: brand + fitur utama ============ -->
        <header class="topbar" role="banner">
          <div class="topbar-left">
            <div class="brand-area">
              <div class="brand-mark">
                <svg class="brand-ico" viewBox="0 0 24 24" width="28" height="28" fill="currentColor" aria-label="Logo Marbel AI">
                  <path d="M12 2.5l1.7 5.1a2.2 2.2 0 0 0 1.4 1.4l5.1 1.7-5.1 1.7a2.2 2.2 0 0 0-1.4 1.4L12 18.9l-1.7-5.1a2.2 2.2 0 0 0-1.4-1.4L3.8 10.7l5.1-1.7a2.2 2.2 0 0 0 1.4-1.4L12 2.5z"/>
                  <circle cx="19" cy="19" r="2.1"/>
                  <circle cx="5" cy="17.5" r="1.4"/>
                </svg>
              </div>
              <div class="brand-info">
                <h1 class="brand-name">Marbel<span class="brand-accent">AI</span></h1>
                <p class="brand-subtitle">Free AI Workspace</p>
              </div>
            </div>
          </div>

          <div class="topbar-right">
            <!-- Status -->
            <div class="status-bar" role="status" aria-live="polite">
              <span id="statusDot" class="status-dot"></span>
              <span id="statusLabel" class="status-text">menghubungkan…</span>
            </div>

            <!-- Model Dropdown -->
            <div class="model-selector" role="combobox" aria-label="Pilih model AI">
              <button class="model-trigger" aria-haspopup="listbox" aria-expanded="false" aria-controls="modelList">
                <span class="model-trigger-text">Semua Model</span>
                <span class="model-trigger-caret">▼</span>
              </button>
              <ul id="modelList" class="model-dropdown" role="listbox" style="display: none;">
                <li class="model-dropdown-item" role="option" data-value="semua">Semua Model (Tercepat)</li>
                <!-- Model items diisi oleh JavaScript -->
              </ul>
            </div>

            <!-- Tema -->
            <div class="theme-area" role="group" aria-label="Ganti tema">
              <button type="button" class="theme-btn" data-theme="light" aria-label="Tema Terang" title="Terang">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 12a4 4 0 0 1 4-4v7a7 7 0 0 1-14 0V8a4 4 0 0 1 4-4m0 3a5 5 0 1 0 0-10 5 5 0 0 0 0 10"/></svg>
              </button>
              <button type="button" class="theme-btn" data-theme="dark" aria-label="Tema Gelap" title="Gelap">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 12a4 4 0 0 0 0 8 4 4 0 0 0 0-8m0-4a4 4 0 1 1 0 8 4 4 0 0 1 0-8"/></svg>
              </button>
              <button type="button" class="theme-btn" data-theme="system" aria-label="Tema Sistem" title="System">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2v4h16v-4zM12 8v8h12v-4h-4v6h-4v-6H8v-8h4z"/></svg>
              </button>
            </div>

            <!-- Thread / New -->
            <div class="actions-bar">
              <button class="new-thread-btn" title="Thread Baru" aria-label="Thread baru">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
              </button>
            </div>
          </div>
        </header>

        <!-- ============ Area Percakapan ============ -->
        <div class="conversation-area">
          <!-- Sidebar daftar thread -->
          <nav class="thread-sidebar" aria-label="Riwayat percakapan">
            <div class="sidebar-header">
              <span class="sidebar-title">Riwayat</span>
              <button class="sidebar-close" aria-label="Tutup sidebar">&times;</button>
            </div>
            <ul id="threadList" class="thread-list"></ul>
            <div class="sidebar-footer">
              <button class="sidebar-new-thread">Thread Baru</button>
            </div>
          </nav>

          <!-- Area chat utama -->
          <div class="chat-main">
            <!-- Welcome state -->
            <div id="welcomeScreen" class="welcome-screen" role="alert">
              <div class="welcome-content">
                <span class="welcome-icon">✦</span>
                <h2>Selamat datang di Marbel AI</h2>
                <p>Mari mulai berkarya dengan 14 model AI gratis yang saling melengkapi untuk jawaban yang lebih akurat dan cepat.</p>
                <div class="welcome-actions">
                  <button class="start-chat-btn">Mulai Berobat</button>
                </div>
              </div>
            </div>

            <!-- Chat messages -->
            <div id="messages" class="chat-messages" role="main"></div>

            <!-- Active indicator -->
            <div id="activeBadge" class="active-indicator" role="status" aria-live="polite">
              <span class="indicator-spark" aria-hidden="true">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.9 5.7a2 2 0 0 0 1.3 1.3L21 11l-5.8 1.9a2 2 0 0 0-1.3 1.3L12 20l-1.9-5.8a2 2 0 0 0-1.3-1.3L3 11l5.8-2a2 2 0 0 0 1.3-1.3L12 2z"/></svg>
              </span>
              <span class="indicator-text">mengetik…</span>
            </div>
          </div>
        </div>

        <!-- ============ Composer (Input Area) ============ -->
        <form id="form" class="composer" autocomplete="off" role="form">
          <div class="composer-wrapper">
            <textarea 
              id="input" 
              rows="1" 
              placeholder="Tanya apa saja ke Marbel AI…" 
              aria-label="Pesan Anda"
              aria-placeholder="Tanyakan apa saja, tentang apapun"
            ></textarea>
            <div class="composer-input-actions">
              <button type="submit" class="send-btn" title="Kirim pesan" aria-label="Kirim">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
              </button>
              <button type="button" class="mic-btn" title="Catatan suara" aria-label="Catatan suara" disabled>
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
              </button>
            </div>
          </div>

          <!-- Quick actions / suggestions -->
          <div class="suggestions-bar" role="region" aria-label="Prompt paling sering">
            <span class="suggestions-title">Atau coba pertanyaan umum:</span>
            <div class="suggestions-grid">
              <button class="suggestion-btn" data-prompt="Tanyakan apa saja" aria-label="Tanyakan apa saja">💡 Tanyakan apa saja</button>
              <button class="suggestion-btn" data-prompt="Bantu tulis, rapikan, atau jelaskan" aria-label="Bantu tulis, rapikan, atau jelaskan">✍️ Bantu tulis, rapihin, atau jelaskan</button>
              <button class="suggestion-btn" data-prompt="Ringkas artikel, dokumen, atau ide panjang" aria-label="Ringkas artikel, dokumen, atau ide panjang">📝 Ringkas artikel, dokumen, atau ide</button>
              <button class="suggestion-btn" data-prompt="Terjemahkan, carikan fakta, atau jelaskan istilah" aria-label="Terjemahkan, carikan fakta, atau jelaskan istilah">🔍 Terjemahkan atau carikan fakta</button>
              <button class="suggestion-btn" data-prompt="Tulis ide cerata atau konsep kreatif baru" aria-label="Tulis ide kreatif baru">🎨 Tulis ide kreatif baru</button>
              <button class="suggestion-btn" data-prompt="Buatkan tugas sekolah atau materi belajar" aria-label="Buatkan tugas sekolah">📚 Buatkan tugas sekolah & belajar</button>
            </div>
          </div>
        </form>
      </main>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
